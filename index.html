<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Assignment</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">

    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">

    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
</head>

<body>
    <div class="parent">
        <div class="left side">
            <div class="ppt-container" id="pptc1"></div>
            <div class="ppt-container" id="pptc2"></div>
            <div class="ppt-container" id="pptc3"></div>
            <div class="ppt-container" id="pptc4"></div>
        </div>
        <div class="right side">
            <div class="ppt-container" id="pptc5"></div>
            <div class="ppt-container" id="pptc6"></div>
            <div class="ppt-container" id="pptc7"></div>
            <div class="ppt-container" id="pptc8"></div>
        </div>

        <div class="menu-btn"><i class="bx bx-gallery-vertical"></i></div>
    </div>

    <div class="container">
        <div class="screen">
            <div class="topbar">
                <div class="backbtn"><i class="bx bx-arrow-left"></i></div>
                <div class="dp"></div>
                <h1 class="name">Nalanda University</h1>
                <div class="threedots"><i class="bx bx-dots-vertical-rounded"></i></div>
            </div>
            <div class="mainbody">
            </div>
            <div class="footer">
                <div class="typebar">
                    <p>Message</p>
                    <div class="btn-cont">
                        <div class="att"><i class="bx bx-paperclip"></i></div>
                        <div class="pay"><i class="bx bx-rupee"></i></div>
                        <div class="camera"><i class="bx bx-camera"></i></div>
                    </div>
                </div>
                <div class="voice-rec"><i class="bx bx-microphone"></i></div>
            </div>
        </div>
        <div class="send-btn" id="send-btn1"><i class="bx bx-send"></i></div>
        <div class="send-btn" id="send-btn2"><i class="bx bx-send"></i></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
